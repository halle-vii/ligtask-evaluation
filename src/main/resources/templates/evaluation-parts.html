<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><body>
<head th:fragment="head(title)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title} + ' · LIGTask'"></title><script src="/sidebar-state.js"></script><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/evaluation.css"><script src="/evaluation.js" defer></script></head>
<header class="eval-top" th:fragment="top"><a class="brand" href="/">LIGTASK</a><a href="/">Datasets</a><a href="/evaluation" aria-current="page">Evaluation</a><div class="dataset-choice"><label for="dataset-choice">Dataset</label><select id="dataset-choice" aria-label="Dataset"><option th:each="d:${datasets}" th:value="${datasetLinks[d.id]}" th:selected="${d.id == datasetId}" th:text="${d.name + (d.archived_at != null ? ' (Removed)' : '')}"></option></select><span class="badge" th:if="${dataset.synthetic}">SYNTHETIC</span><span class="badge" th:if="${dataset.archived_at != null}">REMOVED</span></div></header>
<nav id="evaluation-navigation" class="eval-nav" aria-label="Evaluation navigation" th:fragment="navigation(active)">
<div class="sidebar-links">

<a class="nav-item" th:href="${overviewUrl}" aria-label="Overview" title="Overview" th:classappend="${active == 'overview' ? 'active' : ''}" th:attr="aria-current=${active == 'overview' ? 'page' : null}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span class="nav-label">Overview</span></a>
<a class="nav-item" th:href="${promptsUrl}" aria-label="Prompts" title="Prompts" th:classappend="${active == 'prompts' ? 'active' : ''}" th:attr="aria-current=${active == 'prompts' ? 'page' : null}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h16v14H8l-4 4Z"/><path d="M8 7h8M8 11h6"/></svg><span class="nav-label">Prompts</span></a>
<a class="nav-item" th:href="${runsUrl}" aria-label="Runs" title="Runs" th:classappend="${active == 'runs' ? 'active' : ''}" th:attr="aria-current=${active == 'runs' ? 'page' : null}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m10 8 6 4-6 4Z"/></svg><span class="nav-label">Runs</span></a>
<a class="nav-item" th:href="${coverageUrl}" aria-label="Dataset coverage" title="Dataset coverage" th:classappend="${active == 'coverage' ? 'active' : ''}" th:attr="aria-current=${active == 'coverage' ? 'page' : null}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18m4-7 2 2 3-4"/></svg><span class="nav-label">Dataset coverage</span></a>
<hr class="sidebar-divider" aria-label="Model results">
<a class="nav-item model-nav-item" th:each="model:${models}" th:href="${modelLinks[model.key]}" th:aria-label="${model.name + ' results'}" th:title="${model.name + ' results'}" th:classappend="${active == 'model' and selectedModel != null and selectedModel.key == model.key ? 'active' : ''}" th:attr="aria-current=${active == 'model' and selectedModel != null and selectedModel.key == model.key ? 'page' : null}"><img class="model-logo" th:src="${model.logo()}" alt="" aria-hidden="true" width="20" height="20"><span class="nav-label" th:text="${model.name}"></span></a>
</div>

<div class="sidebar-toggle-footer"><button class="sidebar-toggle" type="button" aria-controls="evaluation-navigation" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m7-11-3 3 3 3"/></svg></button></div>
</nav>

<div class="run-choice" th:fragment="runChoice"><label for="results-run">Run</label><select id="results-run" disabled><option>No saved runs</option></select><a th:href="${runsUrl}">Manage runs</a></div>
<div class="metric-grid" th:fragment="metrics"><article th:each="metric:${metrics}"><span th:text="${metric}"></span><strong>N/A</strong></article></div>
<nav class="task-tabs" aria-label="Task" th:fragment="tasks"><a th:each="t:${#strings.arraySplit('ALL,NLU,NLR,NLG', ',')}" th:href="@{/evaluation/{id}(id=${datasetId},task=${t == 'ALL' ? '' : t},language=${filters.language},context=${filters.context},q=${filters.q})}" th:classappend="${filters.task == (t == 'ALL' ? '' : t) ? 'active' : ''}" th:attr="aria-current=${filters.task == (t == 'ALL' ? '' : t) ? 'page' : null}" th:text="${t == 'ALL' ? 'Overview' : t}"></a></nav>
<form id="filters" class="filters-panel" method="get" th:fragment="filters" th:action="${formPath}"><fieldset><legend>LANGUAGE</legend><label th:each="v:${#strings.arraySplit('ALL,EN,FIL', ',')}"><input type="radio" name="language" th:value="${v == 'ALL' ? '' : v}" th:checked="${filters.language == (v == 'ALL' ? '' : v)}"><span th:text="${v == 'ALL' ? 'All languages' : (v == 'EN' ? 'English' : 'Filipino')}"></span></label></fieldset><fieldset><legend>CONTEXT CONDITION</legend><label th:each="v:${#strings.arraySplit('ALL,SAFE,UNSAFE,UNKNOWN', ',')}"><input type="radio" name="context" th:value="${v == 'ALL' ? '' : v}" th:checked="${filters.context == (v == 'ALL' ? '' : v)}"><span th:text="${v == 'ALL' ? 'All conditions' : v}"></span></label></fieldset><fieldset><legend>TASK TYPE</legend><label th:each="v:${#strings.arraySplit('ALL,NLU,NLR,NLG', ',')}"><input type="radio" name="task" th:value="${v == 'ALL' ? '' : v}" th:checked="${filters.task == (v == 'ALL' ? '' : v)}"><span th:text="${v == 'ALL' ? 'All tasks' : (v == 'NLU' ? 'Natural Language Understanding (NLU)' : (v == 'NLR' ? 'Natural Language Reasoning (NLR)' : 'Natural Language Generation (NLG)'))}"></span></label></fieldset><input type="hidden" name="q" th:value="${filters.q}"><button type="submit">Apply filters</button><a class="reset" th:href="${resetUrl}">Reset all</a></form>
<nav class="pagination" aria-label="Results pages" th:fragment="pagination">
<span th:text="${'Showing ' + page.start + '–' + page.end + ' of ' + page.count + ' matching prompts (' + page.total + ' total)'}"></span>
<div class="page-picker">
<a class="pagination-arrow" th:if="${page.number > 0}" th:href="${previousUrl}" aria-label="Previous page" title="Previous page"><span aria-hidden="true">‹</span></a>
<button class="pagination-arrow" th:unless="${page.number > 0}" type="button" disabled aria-label="Previous page"><span aria-hidden="true">‹</span></button>
<form class="page-choose" method="get" th:action="${formPath}">
<input type="hidden" name="task" th:value="${filters.task}"><input type="hidden" name="language" th:value="${filters.language}"><input type="hidden" name="context" th:value="${filters.context}"><input type="hidden" name="q" th:value="${filters.q}">
<select class="page-select" name="page" aria-label="Select results page" title="Choose a page" th:disabled="${page.pages <= 1}"><option th:each="n:${#numbers.sequence(0, page.pages - 1)}" th:value="${n}" th:selected="${n == page.number}" th:text="${(n + 1) + ' OF ' + page.pages}"></option></select>
<noscript><button type="submit">Go</button></noscript>
</form>
<a class="pagination-arrow" th:if="${page.number + 1 < page.pages}" th:href="${nextUrl}" aria-label="Next page" title="Next page"><span aria-hidden="true">›</span></a>
<button class="pagination-arrow" th:unless="${page.number + 1 < page.pages}" type="button" disabled aria-label="Next page"><span aria-hidden="true">›</span></button>
</div>
</nav>
</body></html>
