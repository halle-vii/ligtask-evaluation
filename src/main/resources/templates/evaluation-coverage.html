<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{evaluation-parts :: head('Dataset coverage')}"></head><body class="eval-app"><header th:replace="~{evaluation-parts :: top}"></header><div class="eval-shell"><nav th:replace="~{evaluation-parts :: navigation('coverage')}"></nav><main class="eval-main coverage-main"><div class="coverage-heading"><h1>Dataset coverage</h1><div class="coverage-meta"><span class="badge" th:text="${dataset.synthetic ? 'SYNTHETIC DATA' : 'SOURCE DATA · UNVERIFIED'}"></span><span th:text="${dataset.version}"></span><span>Entire dataset</span></div></div><div th:replace="~{fragments :: coverage}"></div><details class="dataset-details"><summary>Dataset details</summary><dl><dt>Dataset</dt><dd th:text="${dataset.name}"></dd><dt>Version / schema</dt><dd><span th:text="${dataset.version}"></span> · <span th:text="${dataset.schema_version}"></span></dd><dt>Source file</dt><dd th:text="${dataset.source_filename}"></dd><dt>Imported</dt><dd th:text="${dataset.imported_at}"></dd><dt>SHA-256</dt><dd><code th:text="${dataset.source_sha256}"></code></dd></dl></details>
</main></div></body></html>
