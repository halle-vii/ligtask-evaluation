<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LIGTask · Dataset preview</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/preview.js" defer></script>
</head>
<body>
<header><a class="brand" href="/">LIGTASK</a><span>Datasets</span></header>
<main>
  <a href="/">← Choose another file</a>
  <div class="preview-heading">
    <h1 id="preview-title" tabindex="-1">Dataset preview</h1>
    <form th:if="${document.valid()}" method="post" th:action="@{/import}">
      <input type="hidden" name="token" th:value="${token}">
      <button type="submit">Confirm import</button>
    </form>
  </div>
  <p class="preview-metadata"><strong th:text="${document.name}"></strong> <span class="badge" th:if="${document.synthetic}">SYNTHETIC</span></p>
  <section class="notice" th:unless="${#lists.isEmpty(document.warnings)}"><p th:each="w:${document.warnings}" th:text="${w}"></p></section>
  <th:block th:if="${document.valid()}">
    <div th:replace="~{fragments :: coverage}"></div>
    <section>
      <h2>Prepared records</h2>
      <p th:if="${#lists.size(document.records) > #lists.size(previewRecords)}" th:text="${'Showing the first ' + #lists.size(previewRecords) + ' of ' + #lists.size(document.records) + ' prompts. Confirm import to browse all prompts.'}"></p>
      <details th:each="r:${previewRecords}">
        <summary><span th:text="${r.path('instance_id').asText()}"></span> · <span th:text="${r.path('task_type').asText()}"></span> · <span th:text="${r.path('language_variant').asText()}"></span></summary>
        <p class="text" th:text="${r.path('prepared_prompt_text').asText()}"></p>
        <pre th:text="${r.toPrettyString()}"></pre>
      </details>
    </section>
  </th:block>
</main>
<button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top" title="Back to top" hidden>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-7 7 7-7 7 7"/></svg>
</button>
</body>
</html>
