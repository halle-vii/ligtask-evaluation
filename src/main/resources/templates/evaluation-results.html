<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{evaluation-parts :: head(${selectedModel == null ? 'Prompts' : selectedModel.name + ' results'})}"></head><body class="eval-app"><header th:replace="~{evaluation-parts :: top}"></header><div class="eval-shell"><nav th:replace="~{evaluation-parts :: navigation(${selectedModel == null ? 'prompts' : 'model'})}"></nav><main class="results-main"><div class="results-heading"><h1 th:text="${selectedModel == null ? 'Prepared prompts' : selectedModel.name + ' Safety Evaluation Results'}"></h1><div class="model-heading-run" th:if="${selectedModel != null}"><div th:replace="~{evaluation-parts :: runChoice}"></div></div></div><div class="results-toolbar"><button id="toggle-prompt-filters" class="filter-toggle" type="button" aria-controls="prompt-filter-panel" aria-expanded="true" hidden th:with="count=${(#strings.isEmpty(filters.language) ? 0 : 1) + (#strings.isEmpty(filters.context) ? 0 : 1) + (#strings.isEmpty(filters.task) ? 0 : 1)}" th:attr="data-active-count=${count}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8v7l-4 2V12Z"/></svg><span>Filters</span><span class="filter-count" th:if="${count > 0}" th:text="${count}" th:aria-label="${count + ' active filters'}"></span><svg class="filter-toggle-chevron" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 5 7 7-7 7"/></svg></button><form class="search-form" method="get" th:action="${formPath}"><input type="hidden" name="run" th:if="${selectedRunId != null}" th:value="${selectedRunId}"><input type="hidden" name="task" th:value="${filters.task}"><input type="hidden" name="language" th:value="${filters.language}"><input type="hidden" name="context" th:value="${filters.context}"><label class="sr-only" for="prompt-search">Search identifiers, prompt, context, or policy</label><input id="prompt-search" name="q" type="search" maxlength="200" th:value="${filters.q}" placeholder="Search ID, query, context, or policy"><button class="search-icon-button" type="submit" aria-label="Search" title="Search"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button></form><a class="export-button" th:href="${metricZipUrl}" data-open-metric-export aria-haspopup="dialog" aria-controls="metric-export-dialog">Export metrics</a></div><div class="results-layout"><aside id="prompt-filter-panel" aria-label="Prompt filters"><form th:replace="~{evaluation-parts :: filters}"></form></aside><div class="results-content"><div th:if="${selectedModel != null}"><div th:replace="~{evaluation-parts :: metrics}"></div></div><nav th:replace="~{evaluation-parts :: pagination}"></nav><div class="table-wrap result-table" th:classappend="${selectedModel == null ? 'prepared-prompts-table' : ''}"><table><thead><tr><th>ID / language</th><th>Query</th><th>Task type</th><th>Context condition</th><th>Human label</th><th th:if="${selectedModel != null}">LLM label</th><th th:if="${selectedModel != null}">Result</th></tr></thead><tbody><tr th:each="r:${page.rows}" th:with="reference=${humanReferences[r.id]},response=${savedModelResults[r.id]}"><td><a class="instance-link" th:href="${promptLinks[r.id]}" th:text="${r.instance_id}"></a><small th:text="${r.language_variant == 'EN' ? 'English' : 'Filipino'}"></small></td><td><a class="query-link" th:href="${promptLinks[r.id]}"><span class="query-preview" th:text="${r.prepared_prompt_text}"></span></a></td><td><span class="task-pill" th:classappend="${r.task_type}" th:text="${r.task_type}"></span></td><td><span class="condition-pill" th:classappend="${r.context_condition}" th:text="${r.context_condition}"></span></td><td><span th:if="${reference.label != null}" th:text="${reference.label}" th:title="${reference.canonicalLabel == null ? 'Source gold.label is not a recognized classification for this task; excluded from calculations.' : 'Human reference from gold.label'}"></span><span th:unless="${reference.label != null}" class="pending-label">Not provided</span></td><td th:if="${selectedModel != null}"><span th:if="${response != null and response.status == 'VALID'}" th:text="${response.classification}"></span><span th:unless="${response != null and response.status == 'VALID'}" class="pending-label">Not evaluated</span></td><td th:if="${selectedModel != null}"><span th:if="${reference.canonicalLabel != null and response != null and response.status == 'VALID'}" th:text="${reference.canonicalLabel == response.classification ? 'Match' : 'Mismatch'}"></span><span th:unless="${reference.canonicalLabel != null and response != null and response.status == 'VALID'}" class="pending-label">Not evaluated</span></td></tr><tr th:if="${page.count == 0}"><td th:colspan="${selectedModel == null ? 5 : 7}" class="no-results"><h2>No matching prompts</h2><p>Try another search or reset the filters.</p><a th:href="${resetUrl}">Reset all filters</a></td></tr></tbody></table></div><nav th:replace="~{evaluation-parts :: pagination}"></nav></div></div></main></div><div th:replace="~{metric-export :: dialog}"></div></body></html>
