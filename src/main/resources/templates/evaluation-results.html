<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{evaluation-parts :: head(${selectedModel == null ? 'Prompts' : selectedModel.name + ' results'})}"></head><body class="eval-app"><header th:replace="~{evaluation-parts :: top}"></header><div class="eval-shell"><nav th:replace="~{evaluation-parts :: navigation(${selectedModel == null ? 'prompts' : 'model'})}"></nav><main class="results-main"><div class="results-heading"><h1 th:text="${selectedModel == null ? 'Prepared prompts' : selectedModel.name + ' Safety Evaluation Results'}"></h1><a class="subtle-link" th:if="${selectedModel != null}" th:href="${promptsUrl}">All prompts</a></div><div class="results-layout"><aside><form th:replace="~{evaluation-parts :: filters}"></form></aside><div class="results-content"><div th:if="${selectedModel != null}"><div th:replace="~{evaluation-parts :: metrics}"></div></div><div class="results-toolbar"><a class="filter-focus" href="#filters" aria-label="Jump to filters"><img src="/assets/evaluation-filter.svg" alt=""></a><form class="search-form" method="get" th:action="${formPath}"><input type="hidden" name="task" th:value="${filters.task}"><input type="hidden" name="language" th:value="${filters.language}"><input type="hidden" name="context" th:value="${filters.context}"><label class="sr-only" for="prompt-search">Search identifiers, prompt, context, or policy</label><input id="prompt-search" name="q" type="search" maxlength="200" th:value="${filters.q}" placeholder="Search ID, query, context, or policy"><button class="search-icon-button" type="submit" aria-label="Search" title="Search"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button></form><a class="export-button" th:href="${exportUrl}">Export CSV</a></div><nav th:replace="~{evaluation-parts :: pagination}"></nav><div class="table-wrap result-table"><table><thead><tr><th>ID / language</th><th>Query</th><th>Task type</th><th>Context condition</th><th>Human label</th><th>LLM label</th><th>Result</th></tr></thead><tbody><tr th:each="r:${page.rows}"><td><a class="instance-link" th:href="${promptLinks[r.id]}" th:text="${r.instance_id}"></a><small th:text="${r.language_variant == 'EN' ? 'English' : 'Filipino'}"></small></td><td><a class="query-link" th:href="${promptLinks[r.id]}"><span class="query-preview" th:text="${r.prepared_prompt_text}"></span></a></td><td><span class="task-pill" th:classappend="${r.task_type}" th:text="${r.task_type}"></span></td><td><span class="condition-pill" th:classappend="${r.context_condition}" th:text="${r.context_condition}"></span></td><td><span class="pending-label">Not imported</span></td><td><span class="pending-label">Not imported</span></td><td><span class="pending-label">Not evaluated</span></td></tr><tr th:if="${page.count == 0}"><td colspan="7" class="no-results"><h2>No matching prompts</h2><p>Try another search or reset the filters.</p><a th:href="${resetUrl}">Reset all filters</a></td></tr></tbody></table></div><nav th:replace="~{evaluation-parts :: pagination}"></nav></div></div></main></div></body></html>
