<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{evaluation-parts :: head('Evaluation overview')}"></head><body class="eval-app"><header th:replace="~{evaluation-parts :: top}"></header><div class="eval-shell"><nav th:replace="~{evaluation-parts :: navigation('overview')}"></nav><main class="eval-main"><div class="overview-heading-row"><h1>LIGTask Benchmark</h1><p class="scope-line"><strong th:text="${page.count}"></strong> matching prepared prompts · <span th:text="${page.total}"></span> total</p></div><div class="overview-task-row"><nav th:replace="~{evaluation-parts :: tasks}"></nav><div class="overview-run-row"><div th:replace="~{evaluation-parts :: runChoice}"></div></div></div><div class="table-wrap model-overview"><table><thead><tr><th>Model</th><th th:each="metric:${metrics}" th:text="${metric}"></th><th>Details</th></tr></thead><tbody><tr th:each="model:${models}"><td><a th:href="@{/evaluation/{id}/models/{key}(id=${datasetId},key=${model.key},task=${filters.task},language=${filters.language},context=${filters.context},q=${filters.q},run=${selectedRunId})}" th:text="${model.name}"></a></td><td th:each="metric:${overviewMetrics[model.key].metrics}" th:text="${metric.display()}" th:title="${metric.reason}"></td><td><a class="model-view-button" th:href="@{/evaluation/{id}/models/{key}(id=${datasetId},key=${model.key},task=${filters.task},language=${filters.language},context=${filters.context},q=${filters.q},run=${selectedRunId})}" th:aria-label="${'Open ' + model.name + ' results'}">View</a></td></tr></tbody></table></div></main></div></body></html>
